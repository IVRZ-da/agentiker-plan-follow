name: agentiker-plan-follow
version: 0.5.32
description: "Hermes Plugin für strukturierte Plan-Erstellung, Task-Enforcement, Review-Gates, parallele Gruppen, Auto-Verify/Commit, Disk-Recovery, TTL-Cache, Validierung, Fälligkeit, Archivierung, Cross-Session Koordination, optionaler Git-Versionierung, Auto-Lock/Unlock, Auto-Peer-Review (run_peer_review nach plan_create), TTS-Event-Marker (plan_created, task_completed, review_failed) im Hook-Banner, Lock-Enforcement und cleanup_stale. Bietet 39 Tools, 3 Hooks, 13 Templates, Module-Split (tools/ Subpackage), Write-Guard gegen Test-Schreibzugriffe auf Produktionsdaten und 1400+ Tests."
author: "Johannes Lettner"
license: MIT
repo: https://git.ivory.green/johannes/agentiker-plan-follow-plugin
python_dependencies:
  - "rich>=13"
  - "PyYAML>=6"
hooks:
  - pre_llm_call
  - post_tool_call
  - on_session_end
provides_hooks:
  - pre_llm_call
  - post_tool_call
  - on_session_end
provides_tools:
  - plan_create
  - plan_current
  - plan_complete
  - plan_verify
  - plan_status
  - plan_todo
  - plan_update
  - plan_review
  - plan_auto_review
  - plan_review_profiles
  - plan_review_save_result
  - plan_template
  - plan_suggest
  - plan_time
  - plan_simulate
  - plan_sync
  - plan_decompose
  - plan_list
  - plan_abort
  - plan_delete
  - plan_select
  - plan_validate
  - plan_duedate
  - plan_archive
  - plan_restore
  - plan_roadmap
  - plan_session
  - plan_lock
  - plan_notify
  - plan_history
  - plan_git_init
  - plan_git_push
  - plan_git_status
  - plan_git_sync
  - plan_git_stash
  - plan_git_branch
  - plan_git_tag
  - plan_pr_create
  - plan_coord_cleanup
